<!-- TOP CONTACT BAR -->

<div class="hidden lg:block bg-slate-950 text-white border-b border-white/10">
  <div class="container mx-auto px-4">
    <div class="h-11 flex items-center justify-between">
      <!-- LEFT : CONTACT -->
      <div class="flex items-center gap-6">
        <ng-container *ngFor="let contact of contactItems">
          <a
            [href]="contact.href"
            class="group flex items-center gap-2.5 text-[13px] text-slate-300 hover:text-white transition-all duration-300"
          >
            <!-- ICON -->
            <span
              class="flex items-center justify-center w-7 h-7 rounded-full bg-blue-500/10 text-blue-400 group-hover:bg-blue-500 group-hover:text-white transition-all duration-300"
            >
              <app-icon [name]="contact.icon" [size]="14" [strokeWidth]="2">
              </app-icon>
            </span>

            <!-- TEXT -->
            <span class="font-medium tracking-wide">
              {{ contact.value }}
            </span>
          </a>
        </ng-container>
      </div>

      <!-- RIGHT -->
      <div class="flex items-center gap-5">
        <!-- SOLAR STATUS -->
        <div class="solar-status">
          <div class="solar-icon">
            <div class="sun">
              <span></span>
            </div>

            <div class="solar-panel">
              <div></div>
              <div></div>
              <div></div>
              <div></div>
            </div>
          </div>

          <span class="solar-text"> Clean Energy </span>
        </div>

        <!-- SOCIAL MEDIA -->
        <div class="flex items-center gap-2 pl-5 border-l border-white/10">
          <ng-container *ngFor="let social of socialLinks">
            <a
              [href]="social.href"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="social.label"
              class="social-icon"
              [ngClass]="social.class"
            >
              <app-icon [name]="social.icon" [size]="14" [strokeWidth]="2">
              </app-icon>
            </a>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN HEADER -->
<header
  class="sticky top-0 z-50 border-b transition-all duration-500 ease-out"
  [ngClass]="
    scrolled()
      ? 'bg-white/98 border-slate-200 shadow-lg shadow-slate-900/5 backdrop-blur-xl'
      : 'bg-[#e2e7eb]/95 border-gray-300 shadow-sm backdrop-blur-md'
  "
>
  <div
    class="container mx-auto px-4 transition-all duration-500 sm:px-6"
    [ngClass]="scrolled() ? 'max-w-7xl' : 'max-w-7xl'"
  >
    <!-- ================================================= -->
    <!-- MAIN HEADER -->
    <!-- ================================================= -->

    <div
      class="flex items-center justify-between transition-all duration-500"
      [ngClass]="scrolled() ? 'h-16' : 'h-20'"
    >
      <!-- ================================================= -->
      <!-- LOGO -->
      <!-- ================================================= -->

      <a routerLink="/" fragment="home" class="group flex items-center">
        <img
          src="/images/logo/company_logo.png"
          alt="A-NIK & Co."
          class="w-auto object-contain transition-all duration-500 ease-out"
          [ngClass]="scrolled() ? 'h-14' : 'h-20'"
        />
      </a>

      <!-- ================================================= -->
      <!-- DESKTOP NAVIGATION -->
      <!-- ================================================= -->

      <nav
        class="hidden items-center md:flex"
        [ngClass]="scrolled() ? 'gap-7' : 'gap-9'"
      >
        <!-- HOME -->

        <a
          routerLink="/"
          fragment="home"
          (click)="navigateToSection('home')"
          [ngClass]="{
            'text-primary font-bold': activeSection === 'home',

            'text-slate-600': activeSection !== 'home',
          }"
          class="group relative py-2 text-sm transition-all duration-300 hover:text-primary"
        >
          Home

          <span
            class="absolute bottom-0 left-0 h-0.5 rounded-full bg-primary transition-all duration-300"
            [ngClass]="activeSection === 'home' ? 'w-full' : 'w-0'"
          ></span>
        </a>

        <!-- Rooftop Solar -->

        <a
          routerLink="/"
          fragment="rooftop-solar"
          (click)="navigateToSection('rooftop-solar')"
          [ngClass]="{
            'text-primary font-bold': activeSection === 'rooftop-solar',

            'text-slate-600': activeSection !== 'rooftop-solar',
          }"
          class="group relative py-2 text-sm transition-all duration-300 hover:text-primary"
        >
          Rooftop Solar

          <span
            class="absolute bottom-0 left-0 h-0.5 rounded-full bg-primary transition-all duration-300"
            [ngClass]="activeSection === 'rooftop-solar' ? 'w-full' : 'w-0'"
          ></span>
        </a>

        <!-- ABOUT -->

        <a
          routerLink="/"
          fragment="about"
          (click)="navigateToSection('about')"
          [ngClass]="{
            'text-primary font-bold': activeSection === 'about',

            'text-slate-600': activeSection !== 'about',
          }"
          class="group relative py-2 text-sm transition-all duration-300 hover:text-primary"
        >
          About

          <span
            class="absolute bottom-0 left-0 h-0.5 rounded-full bg-primary transition-all duration-300"
            [ngClass]="activeSection === 'about' ? 'w-full' : 'w-0'"
          ></span>
        </a>

        <!-- SERVICES -->

        <a
          routerLink="/"
          fragment="services"
          (click)="navigateToSection('services')"
          [ngClass]="{
            'text-primary font-bold': activeSection === 'services',

            'text-slate-600': activeSection !== 'services',
          }"
          class="group relative py-2 text-sm transition-all duration-300 hover:text-primary"
        >
          Services

          <span
            class="absolute bottom-0 left-0 h-0.5 rounded-full bg-primary transition-all duration-300"
            [ngClass]="activeSection === 'services' ? 'w-full' : 'w-0'"
          ></span>
        </a>

        <!-- PROJECTS -->

        <a
          routerLink="/"
          fragment="projects"
          (click)="navigateToSection('projects')"
          [ngClass]="{
            'text-primary font-bold': activeSection === 'projects',

            'text-slate-600': activeSection !== 'projects',
          }"
          class="group relative py-2 text-sm transition-all duration-300 hover:text-primary"
        >
          Projects

          <span
            class="absolute bottom-0 left-0 h-0.5 rounded-full bg-primary transition-all duration-300"
            [ngClass]="activeSection === 'projects' ? 'w-full' : 'w-0'"
          ></span>
        </a>

        <!-- CONTACT -->

        <a
          routerLink="/"
          fragment="contact"
          (click)="navigateToSection('contact')"
          [ngClass]="{
            'text-primary font-bold': activeSection === 'contact',

            'text-slate-600': activeSection !== 'contact',
          }"
          class="group relative py-2 text-sm transition-all duration-300 hover:text-primary"
        >
          Contact

          <span
            class="absolute bottom-0 left-0 h-0.5 rounded-full bg-primary transition-all duration-300"
            [ngClass]="activeSection === 'contact' ? 'w-full' : 'w-0'"
          ></span>
        </a>
      </nav>

      <!-- ================================================= -->
      <!-- DESKTOP CTA -->
      <!-- ================================================= -->

      <div class="hidden items-center md:flex">
        <a
          routerLink="/"
          fragment="contact"
          (click)="navigateToSection('contact')"
          class="group relative inline-flex items-center gap-2 overflow-hidden rounded-xl bg-primary font-semibold text-white shadow-md transition-all duration-300 hover:-translate-y-0.5 hover:bg-accent hover:shadow-xl"
          [ngClass]="scrolled() ? 'px-5 py-2 text-sm' : 'px-6 py-3 text-sm'"
        >
          <span class="relative z-10"> Request Consultation </span>

          <span
            class="relative z-10 transition-transform duration-300 group-hover:translate-x-1"
          >
            →
          </span>
        </a>
      </div>

      <!-- ================================================= -->
      <!-- MOBILE BUTTON -->
      <!-- ================================================= -->

      <button
        type="button"
        (click)="toggleMenu()"
        class="flex h-11 w-11 items-center justify-center rounded-xl border border-slate-300 bg-white/80 text-primary shadow-sm transition-all duration-300 hover:bg-white md:hidden"
        [attr.aria-expanded]="isOpen()"
        aria-label="Toggle navigation"
      >
        <span class="relative block h-5 w-5">
          <!-- TOP -->

          <span
            class="absolute left-0 top-0 block h-0.5 w-5 rounded-full bg-current transition-all duration-300"
            [ngClass]="isOpen() ? 'top-2 rotate-45' : ''"
          ></span>

          <!-- MIDDLE -->

          <span
            class="absolute left-0 top-2 block h-0.5 w-5 rounded-full bg-current transition-all duration-300"
            [ngClass]="isOpen() ? 'opacity-0' : 'opacity-100'"
          ></span>

          <!-- BOTTOM -->

          <span
            class="absolute left-0 top-4 block h-0.5 w-5 rounded-full bg-current transition-all duration-300"
            [ngClass]="isOpen() ? 'top-2 -rotate-45' : ''"
          ></span>
        </span>
      </button>
    </div>

    <!-- ================================================= -->
    <!-- MOBILE MENU -->
    <!-- ================================================= -->

    <div *ngIf="isOpen()" class="border-t border-slate-200 py-5 md:hidden">
      <nav class="space-y-1">
        <a
          routerLink="/"
          fragment="home"
          (click)="navigateToSection('home')"
          class="flex items-center justify-between rounded-xl px-4 py-3 font-medium text-slate-700 transition hover:bg-slate-50 hover:text-primary"
        >
          Home
          <span>→</span>
        </a>

        <a
          routerLink="/"
          fragment="about"
          (click)="navigateToSection('about')"
          class="flex items-center justify-between rounded-xl px-4 py-3 font-medium text-slate-700 transition hover:bg-slate-50 hover:text-primary"
        >
          About
          <span>→</span>
        </a>

        <a
          routerLink="/"
          fragment="services"
          (click)="navigateToSection('services')"
          class="flex items-center justify-between rounded-xl px-4 py-3 font-medium text-slate-700 transition hover:bg-slate-50 hover:text-primary"
        >
          Services
          <span>→</span>
        </a>

        <a
          routerLink="/"
          fragment="projects"
          (click)="navigateToSection('projects')"
          class="flex items-center justify-between rounded-xl px-4 py-3 font-medium text-slate-700 transition hover:bg-slate-50 hover:text-primary"
        >
          Projects
          <span>→</span>
        </a>

        <a
          routerLink="/"
          fragment="contact"
          (click)="navigateToSection('contact')"
          class="flex items-center justify-between rounded-xl px-4 py-3 font-medium text-slate-700 transition hover:bg-slate-50 hover:text-primary"
        >
          Contact
          <span>→</span>
        </a>

        <!-- MOBILE CTA -->

        <a
          routerLink="/"
          fragment="contact"
          (click)="navigateToSection('contact')"
          class="mt-3 flex items-center justify-center rounded-xl bg-primary px-5 py-3.5 font-bold text-white shadow-lg transition hover:bg-accent"
        >
          Request Consultation
        </a>
      </nav>
    </div>
  </div>
</header>
